<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut,user-scalable=no">
<meta name="theme-color" content="#15170f">
<title>Steel Ridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D battlefield, HUD clustered in the four corners around a central reticle */
:root{
  --ink:#ece6d6; --dim:#a8a08a; --panel:rgba(17,19,14,.68); --line:rgba(236,230,214,.16);
  --amber:#f2b33d; --hostile:#e5533d; --ok:#a5c46e; --ground:#15170f;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--mono);font-size:13px;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hud{position:fixed;inset:0;pointer-events:none}
#obj{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:7px 14px;font-size:11px;letter-spacing:.14em;color:#f2b33d;white-space:nowrap}
#obj .objbar{width:120px;height:5px;background:rgba(0,0,0,.5)}#obj .objbar i{display:block;height:100%;background:#f2b33d;transform-origin:left}
#objTxt{color:var(--ink);font-variant-numeric:tabular-nums}
#nukeFlash{position:fixed;inset:0;background:#fff8e6;opacity:0;pointer-events:none;z-index:8}
#nukeReady{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(20,21,15,.78);border:1px solid #f2b33d;color:#f2b33d;font-size:12px;letter-spacing:.16em;white-space:nowrap;animation:nkP 1.1s ease-in-out infinite alternate}
#nukeReady b{font-size:18px;line-height:1}
#nukeReady.inbound{border-color:#e5533d;color:#e5533d}
@keyframes nkP{from{box-shadow:0 0 0 0 rgba(242,179,61,0)}to{box-shadow:0 0 18px 2px rgba(242,179,61,.45)}}
#bNuke{left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top,0px));width:70px;height:40px;font-size:12px;border-color:#f2b33d;color:#f2b33d}
#lockBox{position:absolute;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border:2px solid #e5533d;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
#lockBox span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.14em;color:#e5533d;text-shadow:0 1px 2px #000}
#objMark{display:flex;flex-direction:column;align-items:center;gap:3px;transform-origin:0 0}
#objMark i{display:block;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #f2b33d;transform:rotate(45deg);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 8px rgba(242,179,61,.6)}
#objMark span{margin-left:-9px;font-size:10px;letter-spacing:.12em;color:#f2b33d;text-shadow:0 1px 2px #000;white-space:nowrap}
@media (max-width:700px){#obj{top:calc(56px + env(safe-area-inset-top,0px))}#obj .objbar{width:70px}}
#tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;gap:18px;padding:8px 14px;letter-spacing:.08em;font-size:11px;color:var(--dim);text-transform:uppercase}
#tl b{font-family:var(--display);font-size:20px;color:var(--ink);font-weight:700;margin-left:6px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#feed{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:4px;align-items:flex-end;max-width:min(360px,60vw)}
#feed div{padding:5px 10px;background:var(--panel);border-left:3px solid var(--amber);font-size:11px;letter-spacing:.04em;animation:feedIn .25s ease-out}
#feed div.bad{border-left-color:var(--hostile)}
#feed div.fade{opacity:0;transition:opacity .6s}
@keyframes feedIn{from{transform:translateX(12px);opacity:0}}
#cross{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
#tick{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);opacity:0}
#tick.on{animation:tick .22s ease-out}
@keyframes tick{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.ind{position:absolute;left:0;top:0;will-change:transform}
#gunInd{width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #f4efe0;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.4);transition:border-color .15s}
#gunInd::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:#f4efe0;border-radius:50%}
#gunInd.off{border-color:rgba(244,239,224,.4)}
#fpSight{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 3px rgba(255,170,60,.7))}
#aimMark{width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#bombInd{width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid var(--amber);transform-origin:center;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#bombInd span{position:absolute;left:22px;top:-2px;font-size:10px;color:var(--amber);letter-spacing:.1em;text-shadow:0 1px 2px #000;white-space:nowrap}
#leads div{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid var(--hostile);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#reload{position:absolute;left:50%;top:calc(50% + 46px);width:110px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
#reload .bar{width:84px;height:3px;background:rgba(0,0,0,.45);overflow:hidden}
#reload .bar i{display:block;height:100%;width:100%;background:var(--amber);transform-origin:left}
#reload span{font-size:10px;letter-spacing:.16em;color:var(--amber);text-shadow:0 1px 2px #000;white-space:nowrap}
#hitmsg{position:absolute;left:50%;top:calc(50% - 74px);transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.9);opacity:0}
#hitmsg.show{animation:hitPop 1.6s ease-out forwards}
#hitmsg.pen{color:var(--amber)}#hitmsg.kill{color:#fff;font-size:30px}#hitmsg.bounce{color:#c9c3b2}
@keyframes hitPop{0%{opacity:0;transform:translateX(-50%) scale(1.25)}10%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
#dmgdir{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;opacity:0}
#gvig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 22%,rgba(0,0,0,.96) 70%);opacity:0}
#gmeter{position:absolute;left:calc(50% - 150px);top:calc(50% + 70px);color:#ffb547;font-size:12px;letter-spacing:.12em;text-shadow:0 0 4px rgba(255,170,60,.6)}
#fpGlass{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.05) 42%,transparent 50%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.35),transparent 60%)}
#tankFP{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at center,transparent 62%,rgba(8,9,7,.85) 78%,rgba(8,9,7,.97) 100%)}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,30,20,.55));opacity:0}
#warn{position:absolute;left:50%;top:calc(50% + 90px);transform:translateX(-50%);color:var(--hostile);font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:18px;text-shadow:0 1px 4px #000;white-space:nowrap}
#sight{position:absolute;inset:0}
#sight .vig{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0,transparent 34vmin,rgba(6,7,5,.92) 52vmin)}
#sight svg{position:absolute;left:50%;top:50%;width:520px;height:300px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9))}
#rng{position:absolute;left:50%;top:calc(50% + 120px);transform:translateX(-50%);color:var(--amber);font-size:12px;letter-spacing:.14em;text-shadow:0 1px 2px #000}
#status{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:72px 1fr;gap:5px 14px;padding:12px 14px;min-width:270px;align-items:center}
#status .name{grid-column:2;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;line-height:1}
#status .name small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--dim);letter-spacing:.14em;margin-top:3px}
#icon{grid-row:1/span 3;width:72px;height:72px}
.hp{display:flex;gap:3px}
.hp i{flex:1;height:8px;background:rgba(236,230,214,.12)}
.hp i.on{background:var(--ok)}.hp.low i.on{background:var(--hostile)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--dim);letter-spacing:.08em}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.stats .bad{color:var(--hostile)}
#map{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:190px;height:190px;border:1px solid var(--line);background:#20241a}
#markers div{position:absolute;left:0;top:0;display:flex;flex-direction:column-reverse;align-items:center;gap:1px;color:var(--hostile);font-size:10px;letter-spacing:.06em;text-shadow:0 1px 2px #000;will-change:transform}
#markers div.ally{color:var(--ok)}#markers div.ally::before{border-top-color:var(--ok)}
#markers div::before{content:"";width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--hostile);filter:drop-shadow(0 1px 1px #000)}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;opacity:0;transform:translateY(-14px) scale(1.04);transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1)}
#banner.show{transform:none}
#banner.show{opacity:1}
#banner h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,84px);letter-spacing:.06em;line-height:.9;text-shadow:0 4px 18px rgba(0,0,0,.7)}
#banner p{margin:8px 0 0;color:var(--amber);letter-spacing:.2em;font-size:12px;text-transform:uppercase;text-shadow:0 1px 3px #000}

.overlay{animation:ovIn .7s ease-out both}
.overlay .ov-in{animation:ovUp .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes ovIn{from{opacity:0}}
@keyframes ovUp{from{opacity:0;transform:translateY(24px)}}
#cine i{position:fixed;left:0;right:0;height:0;background:#050504;transition:height 1s cubic-bezier(.2,.8,.2,1);z-index:4;pointer-events:none}
#cine i:first-child{top:0}#cine i:last-child{bottom:0}
body.dying #cine i{height:10vh}
#c{transition:filter 1.8s ease}
body.dying #c{filter:saturate(.3) contrast(1.12) brightness(.9) sepia(.12)}
body.dying #hud{opacity:0;transition:opacity .8s}
#deathCard{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:5;pointer-events:none;animation:dcIn 1.4s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes dcIn{from{opacity:0;letter-spacing:.5em}to{opacity:1}}
.dc-eye{font-size:11px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.dc-title{font-family:var(--display);font-weight:800;font-size:clamp(46px,9vw,110px);line-height:.95;color:#f1ebdc;letter-spacing:.06em;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.dc-sub{margin-top:8px;font-size:13px;letter-spacing:.18em;color:var(--hostile);text-transform:uppercase;text-shadow:0 1px 4px #000}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(14,15,11,.9) 0,rgba(14,15,11,.55) 44%,transparent 74%);overflow-y:auto}
.ov-in{margin-top:auto;padding:24px max(24px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px));max-width:600px;display:flex;flex-direction:column;gap:16px}
@media (max-height:720px){.overlay h1{font-size:clamp(44px,10vh,96px)}.keys{gap:3px 14px}.ov-in{gap:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}.lede{font-size:12px;line-height:1.5}}
@media (max-height:520px){.keys{display:none}.overlay h1{font-size:42px;line-height:.9}.overlay h1 br{display:none}.overlay h1 span{margin-left:.25em}.lede,.eyebrow,.best{display:none}.ov-in{gap:8px;padding-top:10px}.veh{padding:6px 9px}.veh b{font-size:16px}.veh small{display:none}.gfx button{min-height:30px;padding:4px 9px}}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber)}
.overlay h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(64px,13vw,136px);line-height:.82;letter-spacing:.01em;text-wrap:balance}
.overlay h1 span{color:var(--amber)}
.lede{margin:0;font-size:13px;line-height:1.65;color:#d3ccb8;max-width:46ch}
.pick.sub .veh b{font-size:17px}.pick.sub .veh{padding:8px 10px 9px}.pick.sub .veh small{line-height:1.35}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px}
#vpick{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
#spick{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){#vpick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.veh{pointer-events:auto;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 12px 11px;background:rgba(236,230,214,.05);border:1px solid var(--line);color:var(--ink);font-family:var(--mono)}
.veh em{font-style:normal;font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.veh b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.04em;line-height:1.05}
.veh small{font-size:10px;color:var(--dim);letter-spacing:.06em}
.veh:hover{background:rgba(236,230,214,.1)}
.veh[aria-checked="true"]{border-color:var(--amber);background:rgba(242,179,61,.13);box-shadow:inset 0 -3px 0 var(--amber)}
.veh[aria-checked="true"] em{color:var(--amber)}
.veh:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn{pointer-events:auto;align-self:flex-start;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:12px 34px 11px;background:var(--amber);color:#1b1a12;border:0;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn:hover{background:#ffc75a}.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);clip-path:none;font-size:16px;padding:10px 20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:11px;color:var(--dim);letter-spacing:.04em}
kbd{font-family:var(--mono);font-size:10px;color:var(--ink);border:1px solid var(--line);background:rgba(236,230,214,.06);padding:2px 6px;white-space:nowrap}
.gfx{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 4px}
.gfx span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.gfx button{font:inherit;font-size:12px;letter-spacing:.06em;padding:6px 11px;background:transparent;color:var(--dim);border:1px solid var(--line);cursor:pointer;min-height:32px}
.gfx button[aria-checked="true"]{color:var(--ink);border-color:var(--amber);background:rgba(242,179,61,.12)}
.gfx button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.best{font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.best b{color:var(--ink)}
#pause{align-items:center;justify-content:center;background:rgba(10,11,8,.6)}
#pause .ov-in{margin:auto;align-items:center;text-align:center}
#pause h1{font-size:clamp(48px,10vw,90px)}

#touch{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:1px solid rgba(236,230,214,.35);border-radius:50%;background:rgba(17,19,14,.3)}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(242,179,61,.7)}
.tbtn{position:absolute;pointer-events:auto;border:1px solid rgba(236,230,214,.4);color:var(--ink);font-family:var(--display);font-weight:700;letter-spacing:.12em;border-radius:50%;background:rgba(17,19,14,.5)}
#bFire{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;height:96px;font-size:18px;background:rgba(229,83,61,.55)}
#bZoom{right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:66px;height:66px;font-size:13px}
#bSeat{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(204px + env(safe-area-inset-bottom,0px));width:54px;height:54px;font-size:11px}
#bView{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));width:54px;height:54px;font-size:11px}
#bRkt{right:calc(122px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px));width:58px;height:58px;font-size:12px}
#bZoom.on{background:rgba(242,179,61,.6);color:#1b1a12}
body.touch #map{width:118px;height:118px;top:calc(56px + env(safe-area-inset-top,0px));bottom:auto}
body.touch #status{min-width:0;grid-template-columns:48px 1fr;padding:8px 10px;top:calc(56px + env(safe-area-inset-top,0px));bottom:auto}
body.touch #icon{width:48px;height:48px}
body.touch #status .name{font-size:15px}
body.touch .keys{display:none}
@media (max-width:560px){#tl{gap:10px;padding:6px 10px}#tl b{font-size:16px}#feed{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px))}.veh b{font-size:18px}.veh{padding:8px}}
@media (prefers-reduced-motion:reduce){#hitmsg.show{animation-duration:.01s;opacity:1}#feed div{animation:none}}
</style>
</head>
<body>


<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="fpGlass" hidden></div>
  <div id="tankFP" hidden></div>
  <div id="gvig"></div>
  <div id="hurt"></div>
  <div id="gmeter" hidden>1.0 G</div>
  <div id="sight" hidden>
    <div class="vig"></div>
    <svg viewBox="-260 -150 520 300" aria-hidden="true">
      <g stroke="#f2b33d" stroke-width="1.6" fill="none">
        <polyline points="-13,13 0,0 13,13"/>
        <line x1="-250" y1="0" x2="-34" y2="0"/><line x1="34" y1="0" x2="250" y2="0"/>
        <line x1="0" y1="26" x2="0" y2="140"/>
        <g stroke-width="1.2">
          <line x1="-54" y1="-5" x2="-54" y2="5"/><line x1="-74" y1="-5" x2="-74" y2="5"/><line x1="-94" y1="-8" x2="-94" y2="8"/><line x1="-134" y1="-5" x2="-134" y2="5"/><line x1="-174" y1="-8" x2="-174" y2="8"/>
          <line x1="54" y1="-5" x2="54" y2="5"/><line x1="74" y1="-5" x2="74" y2="5"/><line x1="94" y1="-8" x2="94" y2="8"/><line x1="134" y1="-5" x2="134" y2="5"/><line x1="174" y1="-8" x2="174" y2="8"/>
          <line x1="-6" y1="50" x2="6" y2="50"/><line x1="-9" y1="74" x2="9" y2="74"/><line x1="-6" y1="98" x2="6" y2="98"/><line x1="-9" y1="122" x2="9" y2="122"/>
        </g>
      </g>
    </svg>
    <div id="rng">RNG — m</div>
  </div>
  <svg id="cross" viewBox="-32 -32 64 64" aria-hidden="true">
    <g stroke="#f2b33d" stroke-width="1.6" fill="none">
      <line x1="-22" y1="0" x2="-9" y2="0"/><line x1="9" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="9" x2="0" y2="18"/>
      <circle r="1.6" fill="#f2b33d" stroke="none"/>

let last=performance.now(),slowT=0,deathReal=0,deathA0=0;
let frameN=0,fpsE=60,fpsLowT=0,fpsHiT=0,curPr=GFX.pr;
function adaptRes(raw){if(raw<=0)return;fpsE+=(1/raw-fpsE)*.05;if(state!=='play'||gfxPref!=='auto')return;
  if(fpsE<27){fpsLowT+=raw;fpsHiT=0;if(fpsLowT>3&&curPr>GFX.minPr+.01){curPr=Math.max(GFX.minPr,curPr*.85);renderer.setPixelRatio(curPr);resize();fpsLowT=0;}}
  else if(fpsE>52){fpsHiT+=raw;fpsLowT=0;if(fpsHiT>8&&curPr<GFX.pr-.01){curPr=Math.min(GFX.pr,curPr+.1);renderer.setPixelRatio(curPr);resize();fpsHiT=0;}}
  else{fpsLowT=Math.max(0,fpsLowT-raw);fpsHiT=0;}}
function frame(now){
  const raw=(now-last)/1000;frameN++;adaptRes(Math.min(raw,.5));
  const real=Math.min(.05,raw);last=now;
  slowT=Math.max(0,slowT-real);const ts=slowT>0?(slowT>1.4?.22:.22+.78*(1-slowT/1.4)):1;const dt=real*ts;
  if(Snd.out&&Snd.ctx)Snd.out.gain.setTargetAtTime(ts<1?.35:.7,Snd.ctx.currentTime,.2);
  if(state==='dead')deathReal+=real;
  if(state!=='pause'){
    clock+=dt;
    if(state==='play')updatePlay(dt);
    else{
      if(state==='menu'&&player){if(player.kind==='ship')shipMotion(player,dt);if(player.kind==='plane'){for(const pr of player.props)pr.rotation.z+=dt*6;player.center.copy(player.root.position);}}
      updateCamera(dt);
      if(state==='dead'){deathT+=dt;if(deathReal>(mode==='naval'?6:4.6)&&$('over').hidden){$('deathCard').hidden=true;$('overTxt').textContent=`The battle goes on · Allies ${tickets.player} · Enemy ${tickets.enemy} tickets. Score ${score}. Redeploy in any vehicle:`;document.querySelectorAll('#rdRow [data-rd]').forEach(b=>{b.textContent=VARS[b.dataset.rd][vsel[b.dataset.rd]].card[0];});$('rdRow').hidden=false;$('endRow').hidden=true;$('over').hidden=false;$('hud').hidden=true;$('touch').hidden=true;}}
      if(Snd.eng)Snd.engine(30,200,0);}
    if(state!=='menu')updateWorld(dt);
    updateShells(dt);updateTrees(dt);updateDebris(dt);updateShocks(dt);fire.update(dt);smoke.update(dt);
    flashLight.intensity*=Math.exp(-dt*14);

// ---------- draw-call reduction: merge static parts of each model ----------
function collectRefs(u){const set=new Set(),seen=new Set();
  const visit=(v,d)=>{if(!v||typeof v!=='object'||seen.has(v)||d>3)return;seen.add(v);
    if(v.isObject3D){set.add(v);return;}
    if(Array.isArray(v)){for(const e of v)visit(e,d+1);return;}
    if(v.isVector3||v.isQuaternion||v.isColor||v.isMaterial||v.isBufferGeometry)return;
    for(const k in v)visit(v[k],d+1);};
  for(const k in u){const v=u[k];if(k==='root'||k==='body')continue;visit(v,0);}
  if(u.root&&u.root.userData){for(const k in u.root.userData)visit(u.root.userData[k],0);}
  return set;}
function mergeMeshes(list,withColor){
  let total=0;for(const e of list){const g=e.m.geometry;total+=(g.index?g.index.count:g.attributes.position.count);}
  const pos=new Float32Array(total*3),nor=new Float32Array(total*3),col=withColor?new Float32Array(total*3):null;let o=0;
  const v=new THREE.Vector3(),nm=new THREE.Matrix3();
  for(const e of list){const m=e.m,g=m.geometry.index?m.geometry.toNonIndexed():m.geometry;const P0=g.attributes.position,N0=g.attributes.normal,c=m.material.color;
    const mat=e.rel,flip=mat.determinant()<0;nm.getNormalMatrix(mat);const n=P0.count;
    for(let i=0;i<n;i++){const ii=flip?(i%3===1?i+1:i%3===2?i-1:i):i;
      v.fromBufferAttribute(P0,ii).applyMatrix4(mat);pos[o*3]=v.x;pos[o*3+1]=v.y;pos[o*3+2]=v.z;
      if(N0){v.fromBufferAttribute(N0,ii).applyMatrix3(nm).normalize();nor[o*3]=v.x;nor[o*3+1]=v.y;nor[o*3+2]=v.z;}
      if(col){col[o*3]=c.r;col[o*3+1]=c.g;col[o*3+2]=c.b;}o++;}
    if(g!==m.geometry)g.dispose();}
  const out=new THREE.BufferGeometry();out.setAttribute('position',new THREE.BufferAttribute(pos,3));out.setAttribute('normal',new THREE.BufferAttribute(nor,3));if(col)out.setAttribute('color',new THREE.BufferAttribute(col,3));out.computeBoundingSphere();return out;}
const _mInv=new THREE.Matrix4();
function staticSubtree(c,keep){let ok=true;c.traverse(o=>{if(!ok)return;if(keep.has(o)||!o.visible){ok=false;return;}
    if(o.isMesh){if(o.isInstancedMesh||Array.isArray(o.material)||o.material.map||o.material.vertexColors||!o.geometry.attributes.normal||!o.geometry.attributes.position||o.geometry.morphAttributes.position)ok=false;}
    else if(!(o.isGroup||o.type==='Object3D'))ok=false;});return ok;}
function mergeKey(m){const t=m.material;
  if(!t.transparent&&t.side===THREE.FrontSide&&m.renderOrder===0){
    if(t.isMeshStandardMaterial&&t.emissive.getHex()===0)return {k:'std|'+(t.flatShading?1:0),bake:true};
    if(t.isMeshBasicMaterial&&!t.fog===false)return {k:'basic',bake:true};}

function mergeTree(node,keep,outMats){
  node.updateMatrixWorld(true);_mInv.copy(node.matrixWorld).invert();
  const buckets=new Map(),absorbed=[];
  for(const c of node.children){
    if(!staticSubtree(c,keep))continue;
    let any=false;c.traverse(o=>{if(!o.isMesh)return;any=true;const mk=mergeKey(o);
      if(!buckets.has(mk.k))buckets.set(mk.k,{mat:o.material,bake:mk.bake,cs:false,rs:false,ro:o.renderOrder,list:[],rough:0,metal:0});
      const b=buckets.get(mk.k);b.cs=b.cs||o.castShadow;b.rs=b.rs||o.receiveShadow;b.rough+=o.material.roughness||0;b.metal+=o.material.metalness||0;
      b.list.push({m:o,rel:new THREE.Matrix4().multiplyMatrices(_mInv,o.matrixWorld)});});
    if(any)absorbed.push(c);}
  let count=0;for(const c of absorbed)c.traverse(o=>{if(o.isMesh)count++;});
  if(count>buckets.size){
    for(const c of absorbed)node.remove(c);
    for(const [,b] of buckets){let mat=b.mat;
      if(b.bake&&b.list.length>1){const n=b.list.length;
        mat=b.mat.isMeshBasicMaterial?new THREE.MeshBasicMaterial({vertexColors:true}):new THREE.MeshStandardMaterial({vertexColors:true,roughness:b.rough/n,metalness:b.metal/n,flatShading:b.mat.flatShading});
        if(outMats)outMats.push(mat);}
      const mm=new THREE.Mesh(mergeMeshes(b.list,mat!==b.mat),mat);mm.castShadow=b.cs;mm.receiveShadow=b.rs;mm.renderOrder=b.ro;node.add(mm);}}
  for(const c of [...node.children])if(c.children.length&&!absorbed.includes(c))mergeTree(c,keep,outMats);
  if(count<=buckets.size)for(const c of absorbed)if(c.children.length)mergeTree(c,keep,outMats);}
function optimizeUnit(u){try{if(u&&u.root){if(u.cockpit)u.cockpit.visible=false;const keep=collectRefs(u);u.root.updateMatrixWorld(true);const nm=[];mergeTree(u.root,keep,nm);if(u.mats)nm.forEach((m,i)=>u.mats['_m'+i]=m);if(u.cockpit)u.cockpit.visible=false;}}catch(e){console.warn('merge skipped',e);}return u;}

makeTank=(f=>(...a)=>optimizeUnit(f(...a)))(makeTank);
makePlane=(f=>(...a)=>optimizeUnit(f(...a)))(makePlane);
makeJet=(f=>(...a)=>optimizeUnit(f(...a)))(makeJet);

})();
